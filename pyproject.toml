[project]
name = "mcp-server"
version = "1.0.0"
description = "A read-only MCP server that gives Claude tools over data-pipeline's published outputs."
readme = "README.md"
license = "MIT"
authors = [
    { name = "yas", email = "355981534+yasabbasi@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
    "mcp==2.3.0",
    "pydantic==2.14.3",
]

[project.scripts]
mcp-server = "mcp_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

# Settings task-agent reads. Agents may not change this file; gate enforces it.
[tool.task-agent]
agent_commands = []
gate_step = "uv run python scripts/sync_samples.py --check https://github.com/yasabbasi/data-pipeline.git"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pymarkdown]
plugins.line-length.enabled = false
plugins.first-line-heading.enabled = false
extensions.front-matter.enabled = true

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pymarkdownlnt==0.9.42",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "yamllint==1.38.0",
]
